[package]
name = "bibledesk"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bibledesk"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
reqwest = { version = "0.12", features = ["blocking", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
